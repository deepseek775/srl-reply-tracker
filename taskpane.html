<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reply Tracker</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.30.0/lib/msal-browser.min.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#f6f8f7; --panel:#fff; --ink:#15232b; --muted:#5f6f77; --line:#e2e8e5;
  --brand:#1d3a4a; --accent:#27a35a; --accent-soft:#e3f4ea;
  --warn:#a86b12; --warn-soft:#fdf1dc; --bad:#c53030; --bad-soft:#fde8e8; --ok:#25855a; --ok-soft:#e3f4ea; --chip:#eef2f1;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#11181b; --panel:#182227; --ink:#e6eef0; --muted:#94a6ad; --line:#27353b; --brand:#cfe3ea;
    --accent:#45c27a; --accent-soft:#16352a; --warn:#f0b357; --warn-soft:#3a2c14; --bad:#ff7b7b; --bad-soft:#3d1c1c;
    --ok:#5fd394; --ok-soft:#16352a; --chip:#202d33; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
.top{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 12px 0;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px}
.title{font-weight:700;font-size:15px;color:var(--brand);flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.status{color:var(--muted);font-size:12px;margin:4px 0 8px}
.tabs{display:flex;gap:2px}
.tab{flex:1;border:0;background:none;color:var(--muted);padding:8px 4px;font:inherit;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.n{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--chip);font-size:11px}
.tab[aria-selected="true"] .n{background:var(--bad-soft);color:var(--bad)}
.wrap{padding:10px 12px 24px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kpi .l{font-size:11px;color:var(--muted);font-weight:600}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.filters input[type=search],.filters select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.filters input[type=search]{flex:1 1 100%}
.chk input{margin:0}
.filters select{flex:1 1 40%}
.chk{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:12px;flex:1 1 100%}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card.d2{border-left-color:var(--bad)} .card.d1{border-left-color:var(--warn)} .card.done{border-left-color:var(--ok);opacity:.85}
.card .h{display:flex;gap:8px;align-items:flex-start}
.who{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.days{font-weight:700;font-variant-numeric:tabular-nums;padding:1px 8px;border-radius:5px;background:var(--chip);white-space:nowrap}
.d2 .days{background:var(--bad-soft);color:var(--bad)} .d1 .days{background:var(--warn-soft);color:var(--warn)} .done .days{background:var(--ok-soft);color:var(--ok)}
.subj{margin-top:3px;word-break:break-word}
.meta{margin-top:3px;color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.err{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:10px;margin-bottom:10px;white-space:pre-wrap}
.signin{text-align:center;padding:30px 10px}
.signin p{color:var(--muted)}
.bar{height:3px;background:var(--accent);width:0;transition:width .3s}
</style>
</head>
<body>
<div class="top">
  <div class="row">
    <div class="title">Reply Tracker</div>
    <button class="btn" id="refresh" title="Check mailbox again">Refresh</button>
  </div>
  <div class="status" id="status">Starting…</div>
  <div class="tabs" role="tablist">
    <button class="tab" data-tab="out" aria-selected="true">I asked<span class="n" id="nOut">0</span></button>
    <button class="tab" data-tab="in" aria-selected="false">Asked me<span class="n" id="nIn">0</span></button>
  </div>
  <div class="bar" id="bar"></div>
</div>
<div class="wrap">
  <div id="error"></div>
  <div class="signin" id="signin" hidden>
    <p>Sign in once so the tracker can read your mailbox (read-only).</p>
    <button class="btn primary" id="signinBtn">Sign in</button>
  </div>
  <div id="main" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="filters">
      <input type="search" id="q" placeholder="Search name, subject, LSR, container…">
      <select id="statusSel"><option value="open">No reply yet</option><option value="done">Replied</option><option value="all">All</option></select>
      <select id="personSel"><option value="">Everyone</option></select>
      <label class="chk"><input type="checkbox" id="workdays"> Count working days only (Sun–Thu)</label>
    </div>
    <div id="list"></div>
  </div>
</div>
<script src="tracker-core.js"></script>
<script src="taskpane.js"></script>
</body>
</html>
